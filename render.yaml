services:
  - type: web
    name: talentdash-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///data/salaries.db
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
